[workspace]
resolver = "2"
members = [
  "src-tauri",
  "crates/xmind-core",
  "crates/xmind-file",
  "crates/xmind-resources",
  "crates/aicompat",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
zip = { version = "9.3", default-features = false, features = ["deflate-flate2"] }
# zip pulls flate2 in without a backend; enable the pure-Rust one explicitly.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
quick-xml = "0.42"
base64 = "0.22"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-webpki-roots", "charset", "json"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
xmind-core = { path = "crates/xmind-core" }
xmind-file = { path = "crates/xmind-file" }
xmind-resources = { path = "crates/xmind-resources" }
aicompat = { path = "crates/aicompat" }

# Native binaries are built small and stripped. The WebView is supplied by the
# OS, so there is no Chromium to ship and no second renderer process to own.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 1
